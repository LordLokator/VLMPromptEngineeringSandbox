version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # GPU stack is pinned together; bump by hand after the GPU smoke test.
      - dependency-name: torch
        update-types: ["version-update:semver-major"]
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

# Caveat: these ignore rules are meant for version updates (GitHub's docs mark `ignore` as also
# shaping security PRs, but do not rely on it). Alert-driven security PRs (like the
# torch/transformers ones) are resolved by upgrading or by dismissing the alert (plan U02);
# do not rely on editing this file to silence them. `cooldown` applies to version updates only.
# Keys verified against GitHub's Dependabot options reference (see commit message).
