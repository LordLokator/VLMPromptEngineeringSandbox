name: security

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.19"
          enable-cache: false
      # osv-scanner does not read pyproject.toml extras, so resolve the gpu extra into a temporary list that
      # is never committed. It only reads *.txt files with "requirements" in the name, and skips git-ignored
      # files by default, so do not add this one to .gitignore. If this step fails, the job fails.
      - name: Resolve the gpu extra from pyproject.toml
        run: >-
          uv pip compile pyproject.toml --extra gpu --python-version 3.11
          --python-platform x86_64-unknown-linux-gnu -o osv-requirements.txt
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        # Scans the list generated above and fails the job on any advisory that osv-scanner.toml does not list.
        # Transitive versions are resolved on each run, so a new advisory can fail a run without a repo change.
        with:
          scan-args: |-
            --recursive
            ./

  # Does not see pyproject.toml extras: on PR #5 it reported no changes although the gpu pins moved, so a green
  # result says nothing about them. osv-scanner above covers them.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
