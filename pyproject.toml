[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Single committed reference for dependencies and setup; there is no requirements or lock file.
# Install from a checkout, inside a virtual environment:
#   pip install .              base: web layer only; not enough to run the app
#   pip install ".[gpu]"       the app with the real model (setup.sh does this, then adds flash-attn)
#   pip install ".[otel]"      optional OpenTelemetry export, added to a gpu install
#   pip install ".[dev]"       tests and lint without a GPU
# These install dependencies only (see [tool.setuptools]); the app runs from the checkout.
#
# Installed outside this file: flash-attn (FlashAttention2, the default VLM_ATTN_IMPL). Checked on
# PyPI 2026-11-26 (2.8.3.post2): source distribution only, without a pyproject.toml, and its setup.py
# imports torch, packaging and wheel. So it is built after the gpu extra with pip's --no-build-isolation
# flag (also its documented install command), which a dependency list here cannot express. setup.sh
# installs it last, unpinned, after upgrading pip, setuptools, wheel and packaging.

[project]
name = "vlm-prompt-engineering-sandbox"
version = "0.1.0"
description = "Web UI for live prompt editing against a Video-LLM (VideoLLaMA3-7B) on short video clips."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Base: web layer only (uvicorn[standard] brings the websockets library needed for /ws).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "loguru",
]

[project.optional-dependencies]
# gpu: full runtime for the real model. Needs a CUDA GPU.
# The transformers/torch/numpy pins are a coupled set (VideoLLaMA3 remote code): change them
# together, and say in the README if the new set has not been run on a GPU.
# The security workflow resolves this extra into a temporary list for osv-scanner, which does not read
# extras from this file. Unpinned and transitive versions are whatever resolves on that run.
# numpy 1.24.4 has no wheels for Python >= 3.12.
gpu = [
    "transformers==4.46.3",
    "torch==2.2.0",
    "numpy==1.24.4",
    "accelerate",
    "decord",
    "opencv-python",
    "ffmpeg-python",
    "imageio-ffmpeg",
    "imageio",
]
# otel: optional OpenTelemetry traces/metrics (OTEL_ENABLED=1, see README). Not needed to run the app.
# SDK and OTLP exporter are one release train (1.45.2); the FastAPI instrumentation is beta-only
# (0.66b2) and must match that train. Versions checked on PyPI 2026-11-25. Bump them together.
otel = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
]
# dev: tests and lint, GPU-free (no torch, transformers, flash-attn or decord). numpy is unpinned
# because tests do not depend on its version and the gpu pin has no 3.12 wheels.
dev = [
    "ruff",
    "pytest",
    "httpx",                  # required by Starlette's TestClient
    "pyyaml",                 # tests/test_workflows.py: workflow/dependabot structure test
    "opencv-python-headless", # CI runners lack libGL; do not use opencv-python here
    "numpy",
    "opentelemetry-sdk",      # tests/test_telemetry.py: in-memory span/metric exporters
]

# Not a library: the extras above are the point, so install no packages from this repo.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
extend-exclude = [".local", "VideoLLaMA3"]

[tool.ruff.lint]
select = ["E", "F", "B", "T20", "BLE", "S104"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Pylance/pyright: resolve imports from a local ./.venv (pip install -e ".[dev,otel]"). torch and
# transformers are intentionally absent there (GPU extra, imported lazily in utils/vlm_wrapper.py).
[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".local", "VideoLLaMA3", ".venv", "tmp"]

# Tests deliberately pass fakes (FakePrompt, FakeSocket, executor stubs) and invalid values
# (set_temperature("0.7")) to exercise validation, so argument-type checks add only noise there.
# Production code keeps the full checks.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportArgumentType = false
reportCallIssue = false

[[tool.pyright.executionEnvironments]]
root = "."
